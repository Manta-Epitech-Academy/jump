services:
  postgres-test:
    image: postgres:18-alpine
    container_name: jump-postgres-test
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: jump
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: jump_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jump']
      interval: 5s
      timeout: 3s
      retries: 5
    # No volume on purpose: this database is disposable by design (TESTING.md -
    # "chaque lancement donne une instance propre"), and the integration suites
    # create and clean up their own rows. Persisting it bought nothing and broke
    # startup: postgres:18 stores data under /var/lib/postgresql/<major>/docker,
    # so a volume left at the pre-18 /var/lib/postgresql/data path makes the image
    # refuse to boot ("there appears to be PostgreSQL data in ... unused
    # mount/volume"). Apply the schema after `up` with:
    #   DATABASE_URL="postgresql://jump:testpassword@localhost:5434/jump_test" \
    #     bunx prisma migrate deploy
