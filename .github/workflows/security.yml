name: Security

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main]
  schedule:
    # Weekly scan: Monday 8:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  ORIGIN: http://localhost:3030
  BETTER_AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
  BETTER_AUTH_URL: http://localhost:3030
  MICROSOFT_CLIENT_ID: ci-dummy
  MICROSOFT_CLIENT_SECRET: ci-dummy
  MICROSOFT_TENANT_ID: ci-dummy
  RESEND_API_KEY: ci-dummy
  RESEND_FROM_EMAIL: noreply@example.com
  DISCORD_CLIENT_ID: ci-dummy
  DISCORD_CLIENT_SECRET: ci-dummy

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install osv-scanner
        run: |
          OSV_SCANNER_VERSION=v2.3.5
          OSV_SCANNER_SHA256=bb30c580afe5e757d3e959f4afd08a4795ea505ef84c46962b9a738aa573b41b
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: Audit dependencies
        run: osv-scanner --lockfile=bun.lock

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=v8.24.3
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_8.24.3_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@v6

      # Pinned rulesets only, no `--config auto`. `auto` resolves rules from
      # the registry at run time (and sends telemetry), which makes a blocking
      # `--error` gate non-deterministic: a new community rule could fail an
      # unrelated PR with no diff change, defeating the pinned image above.
      - name: Run Semgrep
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/security-audit --error --sarif --output semgrep-results.sarif frontend/src/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t jump-sveltekit:scan ./frontend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "jump-sveltekit:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    # Run only on schedule and main push, not on every PR (slow + needs running app)
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bunx prisma migrate deploy

      - name: Build app
        run: bun run build

      # `bun run start` runs the adapter-node build (./build/index.js), which
      # honors PORT + ORIGIN: that's the production surface we want ZAP to hit.
      # `bun run preview` (vite preview) ignores PORT and binds 4173, so the
      # wait loop below would never see the app.
      - name: Start app
        run: bun run start &
        env:
          PORT: 3030

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3030 > /dev/null && exit 0
            sleep 2
          done
          echo "App failed to start within 60s"
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3030"
          rules_file_name: ".github/zap-rules.tsv"
          # -I: do not fail the build on WARN-level alerts (header hardening,
          # informational). Only rules marked FAIL in zap-rules.tsv block the
          # gate; warnings still appear in the uploaded report for triage.
          cmd_options: "-I"
          fail_action: true
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
