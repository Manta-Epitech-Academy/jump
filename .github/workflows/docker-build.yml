name: Build and Push Docker Images

on:
  push:

env:
  REGISTRY: ghcr.io

jobs:
  build-sveltekit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      push: ${{ steps.meta.outputs.push }}
      namespace: ${{ steps.meta.outputs.namespace }}

    steps:
      - uses: actions/checkout@v6

      - name: Set image tag and prefix
        id: meta
        run: |
          PREFIX=$(echo "ghcr.io/${{ github.repository_owner }}/jump" | tr '[:upper:]' '[:lower:]')
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          SHOULD_PUSH=false
          case "${{ github.ref_name }}" in
            main)     echo "tag=latest"   >> "$GITHUB_OUTPUT"; SHOULD_PUSH=true; echo "namespace=jump-prod" >> "$GITHUB_OUTPUT" ;;
            staging)  echo "tag=staging"  >> "$GITHUB_OUTPUT"; SHOULD_PUSH=true; echo "namespace=jump-stg"  >> "$GITHUB_OUTPUT" ;;
            dev)      echo "tag=dev"      >> "$GITHUB_OUTPUT"; SHOULD_PUSH=true; echo "namespace=jump-dev"  >> "$GITHUB_OUTPUT" ;;
            dev-live) echo "tag=dev-live" >> "$GITHUB_OUTPUT"; SHOULD_PUSH=true; echo "namespace=jump-livedev" >> "$GITHUB_OUTPUT" ;;
            dev-live2) echo "tag=dev-live2" >> "$GITHUB_OUTPUT"; SHOULD_PUSH=true; echo "namespace=jump-livedev2" >> "$GITHUB_OUTPUT" ;;
            *)        echo "tag=ci"       >> "$GITHUB_OUTPUT" ;;
          esac
          echo "push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.prefix }}-sveltekit:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=sveltekit-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=sveltekit-${{ github.ref_name }}

  # The generator's image, for the k3s Job that re-seeds an environment. Built
  # from the same context with `--target seeder`, so the base image, the Bun pin
  # and the patch layer cannot drift from the app's.
  #
  # Only `dev` and `staging`: those are the two environments a re-seed can target.
  # `scripts/seed/guard.ts` refuses a production or preproduction connection
  # string unconditionally, so an image for them would be an image nothing could
  # use, and building one would suggest otherwise.
  build-seeder:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.ref_name == 'staging'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set image prefix
        id: meta
        run: |
          PREFIX=$(echo "ghcr.io/${{ github.repository_owner }}/jump" | tr '[:upper:]' '[:lower:]')
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: frontend
          target: seeder
          push: true
          tags: ${{ steps.meta.outputs.prefix }}-seeder:${{ github.ref_name }}
          cache-from: type=gha,scope=seeder-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=seeder-${{ github.ref_name }}

  restart-k3s:
    runs-on: ubuntu-latest
    needs: build-sveltekit
    if: needs.build-sveltekit.outputs.push == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - uses: ./.github/actions/k3s-kubeconfig
        with:
          url: ${{ secrets.K3S_URL }}
          token: ${{ secrets.K3S_TOKEN }}

      - name: Rollout restart deployment
        run: |
          NAMESPACE="${{ needs.build-sveltekit.outputs.namespace }}"
          echo "Restarting deployment in namespace: $NAMESPACE"
          kubectl rollout restart deployment/jump-sk -n "$NAMESPACE"

          # A push on staging also rolls preprod so it picks up the new staging image.
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "Restarting deployment in namespace: jump-preprod"
            kubectl rollout restart deployment/jump-sk -n jump-preprod
          fi

  # Re-seed the environment this push just deployed, so `dev` and `staging`
  # always run the generator built from the commit they serve. Only those two:
  # they are the environments the seeder image exists for, and the generator's
  # own guard refuses every other connection string.
  #
  # Ordering is the whole job. After `restart-k3s`, and after the rollout is
  # complete, because `migrate deploy` is the container CMD and a pod is not
  # ready until it has applied the schema this generator writes against. After
  # `build-seeder`, so the Job pulls the image of this commit and not the
  # previous push's. Serialised per branch, because two generators writing the
  # same deterministic ids into one database collide on the first primary key.
  #
  # The anchor (`--today`) is what keeps a re-seed byte-identical to the last
  # one, and CONTRIBUTING.md (the validation window) says why it must not move
  # between two promotions of one release. On `dev` it is the run date. On
  # `staging` it is the SEED_TODAY_STAGING repository variable, set at the
  # freeze and left alone for the window; without it the job refuses rather
  # than shifting every date in the dataset under the PO.
  seed:
    runs-on: ubuntu-latest
    needs: [build-seeder, restart-k3s]
    if: github.ref_name == 'dev' || github.ref_name == 'staging'
    concurrency:
      group: seed-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - uses: ./.github/actions/k3s-kubeconfig
        with:
          url: ${{ secrets.K3S_URL }}
          token: ${{ secrets.K3S_TOKEN }}

      - name: Resolve the target
        id: target
        run: |
          PREFIX=$(echo "ghcr.io/${{ github.repository_owner }}/jump" | tr '[:upper:]' '[:lower:]')
          case "${{ github.ref_name }}" in
            dev)     NS=jump-dev; ENV=dev;     PROFILE=dev;     TODAY=$(date -u +%F) ;;
            staging) NS=jump-stg; ENV=staging; PROFILE=staging; TODAY="${{ vars.SEED_TODAY_STAGING }}" ;;
          esac
          if [ -z "$TODAY" ]; then
            echo "::error::SEED_TODAY_STAGING is not set. Set the repository variable to the freeze date (YYYY-MM-DD) before promoting to staging; the anchor must stay constant for the validation window."
            exit 1
          fi
          {
            echo "namespace=$NS"
            echo "env=$ENV"
            echo "profile=$PROFILE"
            echo "today=$TODAY"
            echo "image=$PREFIX-seeder:${{ github.ref_name }}"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the rollout
        run: kubectl rollout status deployment/jump-sk -n "${{ steps.target.outputs.namespace }}" --timeout=300s

      - name: Run the seed Job
        env:
          SEED_NAMESPACE: ${{ steps.target.outputs.namespace }}
          SEED_ENV: ${{ steps.target.outputs.env }}
          SEED_PROFILE: ${{ steps.target.outputs.profile }}
          SEED_TODAY: ${{ steps.target.outputs.today }}
          SEED_IMAGE: ${{ steps.target.outputs.image }}
        run: |
          echo "Seeding $SEED_NAMESPACE: $SEED_IMAGE --env $SEED_ENV --profile $SEED_PROFILE --today $SEED_TODAY"
          kubectl delete job jump-seed -n "$SEED_NAMESPACE" --ignore-not-found --wait=true
          envsubst '$SEED_NAMESPACE $SEED_ENV $SEED_PROFILE $SEED_TODAY $SEED_IMAGE' \
            < .github/k8s/seed-job.yml | kubectl create -f -

          # `kubectl wait --for=condition=complete` sits out its whole timeout on
          # a Job that has already failed, so poll both outcomes instead.
          for _ in $(seq 1 180); do
            succeeded=$(kubectl get job jump-seed -n "$SEED_NAMESPACE" -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job jump-seed -n "$SEED_NAMESPACE" -o jsonpath='{.status.failed}')
            if [ "${succeeded:-0}" -ge 1 ]; then
              kubectl logs job/jump-seed -n "$SEED_NAMESPACE" --tail=40
              exit 0
            fi
            if [ "${failed:-0}" -ge 1 ]; then
              kubectl logs job/jump-seed -n "$SEED_NAMESPACE" --tail=80
              echo "::error::The seed Job failed in $SEED_NAMESPACE."
              exit 1
            fi
            sleep 10
          done
          kubectl logs job/jump-seed -n "$SEED_NAMESPACE" --tail=80 || true
          echo "::error::The seed Job did not finish within 30 minutes."
          exit 1
