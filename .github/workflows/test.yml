name: Tests

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main]

defaults:
  run:
    working-directory: frontend

# Dummy env vars so prisma generate (postinstall) and the SvelteKit build
# (which evaluates BetterAuth at module load) succeed in CI.
# Jobs that need real values should override these in their step `env`.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  ORIGIN: http://localhost:3030
  BETTER_AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
  BETTER_AUTH_URL: http://localhost:3030
  MICROSOFT_CLIENT_ID: ci-dummy
  MICROSOFT_CLIENT_SECRET: ci-dummy
  MICROSOFT_TENANT_ID: ci-dummy
  RESEND_API_KEY: ci-dummy
  RESEND_FROM_EMAIL: noreply@example.com

jobs:
  lint-and-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # `core.fileMode` is false in this repo, so `chmod +x` is invisible to git
      # and a new script gets committed 100644. A non-executable git hook does not
      # run at all, silently, which is how the pre-push guard nearly shipped inert.
      # The rule is self-maintaining: anything with a shebang must be executable,
      # so a sourced library needs no exception.
      - name: Executable bit on hooks and entrypoints
        working-directory: ${{ github.workspace }}
        run: |
          fail=0
          for f in $(git ls-files '.githooks/*' 'scripts/*.sh'); do
            head -1 "$f" | grep -q '^#!' || continue
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f has a shebang but is committed $mode. Fix it with: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          exit "$fail"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # The other half of the DESIGN.md contract. `bun run test` covers the
      # token values and their contrast; this covers the classes components are
      # allowed to write. Both block, or the drift they exist to stop restarts
      # against a green build.
      - name: Design Lint
        run: bun run lint:design

      - name: Svelte Check
        run: bun run check

  unit-and-integration:
    name: Unit & Integration Tests
    needs: lint-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

  e2e:
    name: E2E Tests
    needs: unit-and-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      # NOTE: Real E2E tests will need a Postgres service (cf. docker-compose.test.yml)
      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true
