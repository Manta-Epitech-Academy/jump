name: School holidays

# Keeps the campus calendar's school holidays in step with the ministry.
#
# The dates are a copy of the open dataset `fr-en-calendrier-scolaire`, written
# into the repository by `frontend/scripts/fetch-school-holidays.ts` so no page
# depends on a government API at runtime. A copy goes stale: the ministry
# publishes a new school year once a year and sometimes corrects one already
# out. This reruns the script every month and, when the file it writes differs
# from the committed one, or the script fails, opens an issue (or comments on
# the open one) for someone to rerun it on a branch through the usual flow.
#
# An issue and not a pull request: a branch has to trace back to an issue (the
# `Work item` check), and a pull request opened with GITHUB_TOKEN does not
# trigger the required checks.

on:
  schedule:
    # The 1st of every month, 6:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: Compare with the ministry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate the school holidays
        id: fetch
        run: bun scripts/fetch-school-holidays.ts

      # The script's output depends on the dataset alone, so any difference is
      # a change of dates.
      - name: Compare with the committed copy
        id: diff
        run: |
          if ! git diff --quiet -- src/lib/domain/schoolHolidays.data.ts; then
            git diff --stat -- src/lib/domain/schoolHolidays.data.ts
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the issue
        if: failure() || steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.fetch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="chore(calendar): mettre à jour les vacances scolaires"
          if [ "$OUTCOME" = "success" ]; then
            NOTE="Les dates du ministère ont changé depuis la dernière copie : $RUN_URL"
          else
            NOTE="Le script n'a pas pu régénérer les dates (jeu de données indisponible ou modifié) : $RUN_URL"
          fi
          OPEN=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$NOTE"
          else
            { cat ../.github/school-holidays-issue.md; printf '\n%s\n' "$NOTE"; } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
