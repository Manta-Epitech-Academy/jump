# Installs the pinned osv-scanner. One place, so the pull-request audit
# (security.yml) and the daily watch on dev (vulnerability-watch.yml) cannot
# drift on which scanner, or which build of it, decides what a finding is.
# Bumping it is both lines below, the checksum taken from the release's
# osv-scanner_SHA256SUMS.
name: osv-scanner
description: Install the pinned osv-scanner binary, checksum verified.
runs:
  using: composite
  steps:
    - name: Install osv-scanner
      shell: bash
      run: |
        OSV_SCANNER_VERSION=v2.3.5
        OSV_SCANNER_SHA256=bb30c580afe5e757d3e959f4afd08a4795ea505ef84c46962b9a738aa573b41b
        curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
        echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
        chmod +x osv-scanner
        sudo mv osv-scanner /usr/local/bin/
